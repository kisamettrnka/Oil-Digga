<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oil digga</title>
    <!-- Anti-cache: ať Discord ani prohlížeč nedrží starou verzi hry -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        // Každé načtení dostane novou verzi souborů (?v=...), script.js ji čte přes assetUrl()
        window.ASSET_VERSION = Date.now();
        document.write('<link rel="icon" type="image/png" href="img/oil-tower.png?v=' + window.ASSET_VERSION + '">');
        document.write('<link rel="stylesheet" href="style.css?v=' + window.ASSET_VERSION + '">');
    </script>
    <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>

<body>
    <div id="game-wrapper">
        <!-- Scéna 16:9: plátno a HUD nad ním, HUD se škáluje s velikostí scény -->
        <div id="stage">
            <div id="game-canvas-container">
                <div id="loading-text">Načítání...</div>
            </div>

            <!-- Vlevo nahoře: kalendář (kruh = průběh roku) a ovládání času -->
            <div id="hud-clock" class="hud-panel">
                <div id="date-dial">
                    <div id="month">LED</div>
                    <div id="day">1</div>
                </div>
                <div class="time-buttons">
                    <button id="pause-btn" class="time-btn" title="Pauza">❚❚</button>
                    <button id="speed-1" class="time-btn" data-speed="1" title="Normální rychlost">▶</button>
                    <button id="speed-2" class="time-btn" data-speed="2" title="Rychle">▶▶</button>
                    <button id="speed-4" class="time-btn" data-speed="4" title="Nejrychleji">▶▶▶</button>
                </div>
            </div>

            <!-- Nahoře: přehled zdrojů s tempem za den -->
            <div id="hud-stats" class="hud-panel">
                <div class="stat" title="Čerpající vrty / postavené vrty">
                    <svg viewBox="0 0 24 24"><path d="M12 2 7 22h2l1-4h4l1 4h2L12 2Zm0 6 1.5 7h-3L12 8Z"/></svg>
                    <span id="stat-rigs">0/0</span>
                </div>
                <div class="stat" title="Kamiony">
                    <svg viewBox="0 0 24 24"><path d="M2 7h11v9H2V7Zm12 3h4l3 3v3h-7v-6ZM6 19a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm11 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></svg>
                    <span id="stat-trucks">0/8</span>
                </div>
                <div class="stat" title="Ropa v zásobnících vrtů / těžba za den">
                    <svg viewBox="0 0 24 24"><path d="M12 2s7 8 7 13a7 7 0 0 1-14 0c0-5 7-13 7-13Z"/></svg>
                    <span id="stat-oil">0</span><small id="stat-oil-rate" class="rate">+0/den</small>
                </div>
                <div class="stat" title="Prodáno barelů">
                    <svg viewBox="0 0 24 24"><path d="M6 3h12v2l-1 1v12l1 1v2H6v-2l1-1V6L6 5V3Zm3 5v2h6V8H9Zm0 6v2h6v-2H9Z"/></svg>
                    <span id="stat-sold">0</span>
                </div>
                <div class="stat money" title="Peníze / zisk za poslední den">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12.8 6v1.1c1.5.2 2.6 1 2.8 2.4h-1.8c-.2-.6-.8-1-1.8-1-1.1 0-1.7.4-1.7 1 0 .7.6.9 2 1.2 2 .4 3.5 1 3.5 2.8 0 1.4-1.1 2.3-3 2.5V17h-1.6v-1c-1.8-.2-3-1.2-3.1-2.7h1.8c.1.8.9 1.2 2.1 1.2 1.2 0 1.9-.4 1.9-1.1 0-.7-.6-.9-2.1-1.2-1.9-.4-3.3-1-3.3-2.8 0-1.3 1-2.2 2.7-2.4V6h1.6Z" fill="#1a1208"/></svg>
                    <span>$<span id="money-value">3000</span></span><small id="stat-income" class="rate">+$0/den</small>
                </div>
            </div>

            <!-- Vpravo nahoře: kamera a zvuk -->
            <div id="hud-corner">
                <button id="lobby-btn" class="hud-icon-btn hidden" title="Zpět do lobby">👥</button>
                <button id="zoom-out" class="hud-icon-btn" title="Oddálit (−)">−</button>
                <button id="zoom-reset" class="hud-icon-btn" title="Celý pohled (0)">⤢</button>
                <button id="zoom-in" class="hud-icon-btn" title="Přiblížit (+), táhni myší pro posun">+</button>
                <button id="sound-btn" class="hud-icon-btn" title="Zvuk (M)">🔊</button>
            </div>

            <!-- Vlevo: oznámení (toasty), vpravo: cíle roku -->
            <div id="hud-toasts"></div>
            <div id="hud-goals" class="hud-panel"></div>

            <!-- Dole: nástroje a stavby (ikony jsou vlastní SVG, barvu berou z currentColor) -->
            <div id="hud-toolbar" class="hud-panel">
                <div class="tool-group">
                    <div class="group-label">Průzkum</div>
                    <div class="group-buttons">
                        <button id="seismic-btn" class="tool-btn" title="Odpal nálož na svém pozemku, vlna ukáže ložiska v dosahu">
                            <div class="icon"><svg viewBox="0 0 32 32"><path d="M9 12h14v14H9z"/><path d="M16 12V6m-4 0h8"/><path d="M4 30c2-3 4-3 6 0s4 3 6 0 4-3 6 0 4 3 6 0" class="accent"/></svg></div>
                            <div class="label">Seismika</div>
                            <div class="price">$150</div>
                        </button>
                        <button id="drone-btn" class="tool-btn" title="Dron přeletí mapu a paprskem ukáže ložiska pod sebou">
                            <div class="icon"><svg viewBox="0 0 32 32"><path d="M11 11h10v6H11z"/><path d="M4 9h8M20 9h8M8 9v5h16V9"/><path d="M13 20l-3 9M19 20l3 9M10 29h12" class="accent"/></svg></div>
                            <div class="label">Dron</div>
                            <div class="price">$450</div>
                        </button>
                        <button id="radar-btn" class="tool-btn" title="Klikni do podzemí: trvale odhalí ložiska v okolí">
                            <div class="icon"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="3" class="accent"/><path d="M9 9a10 10 0 0 0 0 14M23 9a10 10 0 0 1 0 14M5 5a16 16 0 0 0 0 22M27 5a16 16 0 0 1 0 22"/></svg></div>
                            <div class="label">Georadar</div>
                            <div class="price">$250</div>
                        </button>
                    </div>
                </div>
                <div class="tool-group">
                    <div class="group-label">Stavby</div>
                    <div class="group-buttons">
                        <button id="vrt-btn" class="tool-btn" title="Vrtná věž na vlastním pozemku">
                            <div class="icon"><svg viewBox="0 0 32 32"><path d="M10 28 15 5h2l5 23M12 20h8M13 14h6M11 25l9-8M21 25l-9-8"/><path d="M6 28h20" class="accent"/></svg></div>
                            <div class="label">Vrt</div>
                            <div class="price">$350</div>
                        </button>
                        <button id="silo-btn" class="tool-btn" title="Silo: větší zásobník u vrtu">
                            <div class="icon"><svg viewBox="0 0 32 32"><path d="M8 9c0-3 16-3 16 0v18H8z"/><path d="M8 15h16M8 21h16"/><path d="M20 12v12" class="accent"/></svg></div>
                            <div class="label">Silo</div>
                            <div class="price">$250</div>
                        </button>
                        <button id="truck-btn" class="tool-btn" title="Cisterna sváží ropu k výkupcům">
                            <div class="icon"><svg viewBox="0 0 32 32"><path d="M3 11h16v10H3zM19 14h6l4 4v3H19z"/><circle cx="8" cy="24" r="2.5" class="accent"/><circle cx="23" cy="24" r="2.5" class="accent"/></svg></div>
                            <div class="label">Kamion</div>
                            <div class="price">$150 (0)</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Vpravo dole: deník událostí -->
            <div id="hud-log" class="hud-panel"></div>

            <!-- Závod: žebříček místo cílů roku (net.js) -->
            <div id="hud-race" class="hud-panel"></div>

            <!-- Lobby: hráči z instance aktivity, připravenost a start závodu (net.js) -->
            <div id="lobby" class="overlay hidden">
                <div class="lobby-card">
                    <div class="lobby-title">OIL DIGGA</div>
                    <div class="lobby-sub">Ropný závod: všichni stejná mapa, jeden rok, vyhrává nejvíc peněz</div>
                    <div id="lobby-players"></div>
                    <div class="lobby-actions">
                        <button id="lobby-ready" class="lobby-btn">Připraven</button>
                        <button id="lobby-start" class="lobby-btn primary hidden">Spustit závod</button>
                        <button id="lobby-solo" class="lobby-btn ghost">Hrát sám</button>
                        <button id="lobby-invite" class="lobby-btn ghost hidden">Pozvat</button>
                    </div>
                    <div id="lobby-status">Připojuji…</div>
                </div>
            </div>
            <div id="race-countdown" class="hidden"></div>
            <div id="race-results" class="overlay hidden">
                <div class="lobby-card results-card">
                    <div id="results-title" class="lobby-title small">Průběžné pořadí</div>
                    <div id="results-list"></div>
                    <button id="results-reset" class="lobby-btn primary hidden">Zpět do lobby</button>
                    <div id="results-wait" class="lobby-sub">Další kolo spustí hostitel.</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Skripty se verzují stejně jako CSS; SDK je zabalené esbuildem (npm run build)
        ['dist/discord-sdk.js', 'net.js', 'script.js'].forEach(function (src) {
            document.write('<script src="' + src + '?v=' + window.ASSET_VERSION + '"><\/script>');
        });
    </script>
</body>

</html>
