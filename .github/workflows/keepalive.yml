# Render free tier uspí službu po 15 minutách bez provozu a první hráč pak čeká desítky sekund.
# Tenhle ping ji drží vzhůru. Adresa je v repozitáři jako proměnná RENDER_URL
# (Settings → Secrets and variables → Actions → Variables), bez ní workflow nic nedělá.
name: Keep Render awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/config
        if: ${{ vars.RENDER_URL != '' }}
        run: curl -fsS --max-time 60 "${{ vars.RENDER_URL }}/api/config" > /dev/null && echo "awake"
